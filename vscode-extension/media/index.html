<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨迹标注工作台 · 插件版</title>
<link rel="stylesheet" href="core/app.css">
</head>
<body>
<header><h1>🧭 轨迹人工标注工具（通用版） <span style="font-size:12px;opacity:.7">v1.05</span></h1><button class="btn btn-primary" id="loadBtn">📂 加载轨迹/标注 JSON</button><button class="btn" id="dirBtn" title="一次加载整个文件夹（integrated / normalized / annotation）">📁 加载文件夹</button><input type="file" id="fileInput" multiple accept=".json,.jsonl" hidden><input type="file" id="memInput" accept=".json" hidden><input type="file" id="dirInput" webkitdirectory directory multiple hidden><div class="sel-wrap"><button id="trajBtn" class="sel-btn">（未加载）▾</button><div id="trajPanel" class="sel-panel"><input id="trajSearch" placeholder="搜索编号 / 任务名…"><div id="trajList"></div></div></div><span id="progressInfo" style="font-size:12px;color:#475569;margin-left:4px"></span><input type="text" id="reviewerInput" placeholder="标注人姓名"><button class="btn btn-ghost" id="mtEmailBtn" title="设置翻译邮箱（提高额度）">⚙️ 翻译</button><button class="btn btn-ghost" id="aiSetBtn" title="配置 AI 接口">⚙️ AI</button><button class="btn btn-ghost" id="convBtn" title="把旧标注的 raw step 转成 #K">🔄 转换步骤</button><button class="btn btn-ghost" id="exportBtn">💾 导出</button><button class="btn btn-primary" id="compareBtn">🔍 对比 AI 审核</button><div class="mode-switch"><button class="mbtn on" data-act="mode" data-val="anno">标注</button><button class="mbtn" data-act="mode" data-val="review">审查</button></div><button class="btn btn-ghost" id="introBtn" title="使用说明">❓</button></header><div class="tipbar">💡 点「加载轨迹/标注 JSON」，把轨迹和对应的 annotation 一起选上（支持 JSON / JSONL），工具会自动识别并配对；也可以直接把文件拖进来。<span id="cacheStatus" style="color:#0369a1"></span><span id="loadTip" style="color:#b45309;margin-left:6px"></span></div><main><section class="panel"><div class="panel-head">📜 原始轨迹 <span class="muted" id="trajTitle"></span></div><div class="panel-body" id="trajBody"><div class="drop" id="dropTip">还没有加载数据<br>点右上角「加载轨迹/标注 JSON」，或把 JSON 文件拖到这里</div></section><section class="panel"><div class="panel-head">✍️ My Judgment<div class="tabs"><button class="tab on" data-act="tab" data-tab="judge" id="tabJudge">判断</button><button class="tab" data-act="tab" data-tab="overview" id="tabOverview">概览</button><button class="tab" data-act="tab" data-tab="timeline" id="tabTimeline">时间线</button><button class="tab" data-act="tab" data-tab="memory" id="tabMemory">记忆</button><span id="pluginTabs" style="display:contents"></span></div></div><div class="panel-body" id="judgeBody"></div><div class="panel-body" id="overviewBody" style="display:none"></div><div class="panel-body" id="timelineBody" style="display:none"></div><div class="panel-body" id="memoryBody" style="display:none"></div><div id="pluginBodies"></div></section></main><div class="panel" id="comparePanel"><div class="panel-head">🔍 AI Review Comparison</div><div class="panel-body" id="compareBody"></div></div><div class="modal-mask" id="modalMask" style="display:none"><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><button class="btn" data-act="modalClose">关闭</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script src="core/app.js"></script>
<script src="plugins/cases.js"></script>
<script src="plugins/calibration.js"></script>
</body>
</html>
